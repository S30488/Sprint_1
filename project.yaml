dataset: iranian_churn

features:
  numeric:
    - Call Failure
    - Subscription Length
    - Charge Amount
    - Seconds of Use
    - Frequency of use
    - Frequency of SMS
    - Distinct Called Numbers
    - Age Group
    - Age
  categorical:
    - Complains
    - Tariff Plan
    - Status

split:
  test_size: 0.2
  random_state: 42

paths:
  ci_sample: data/01_raw/sample.csv
  metrics: metrics.json
